[project]
name = "scrapers"
version = "0.1.0"
description = "A Python package for web scraping using BeautifulSoup and Playwright."
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
]

[project.scripts]
scrapers = "scrapers:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
